name: Generate Snake

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0,12 * * *"
  
  push:
    branches:
    - TheGiraffe3

jobs:
  Snake-Generation:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
    
      - name: Generate snake files
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/github-contribution-grid-snake.gif?color_snake=blue&color_dots=#D1FFBD,#90EE90,#008000,#06402B,#013220
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build status
        run: git status

      - name: Change commit author info
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated commit: update snake info"
          git push
